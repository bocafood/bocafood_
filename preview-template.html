<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview mobile do template público | Boca Food</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --text:#1f2933;
    --muted:#687385;
    --line:#d9dee7;
    --action:#c4362a;
    --action-dark:#9e2418;
    --soft:#fff1ef;
    --shadow:0 14px 38px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
  body{padding-top:94px}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(15,23,42,.06);backdrop-filter:blur(10px)}
  .topbar-inner{display:flex;align-items:center;gap:14px;padding:14px 18px;max-width:980px;margin:0 auto}
  .title-wrap{min-width:260px}
  h1{font-size:17px;line-height:1.1;margin:0;font-weight:800}
  .notice{font-size:12px;color:var(--muted);margin-top:4px}
  .controls{display:flex;align-items:end;gap:10px;flex:1;flex-wrap:wrap}
  label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  input,select{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:14px;padding:0 11px;outline:none}
  input:focus,select:focus{border-color:var(--action);box-shadow:0 0 0 3px rgba(196,54,42,.12)}
  .tenant-input{width:260px}
  .btn{height:38px;border:1px solid transparent;border-radius:9px;padding:0 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
  .btn-primary{background:var(--action);color:#fff}
  .btn-primary:hover{background:var(--action-dark)}
  .btn-secondary{background:#fff;color:var(--text);border-color:var(--line)}
  .btn-secondary:hover{border-color:var(--action);color:var(--action)}
  .workspace{max-width:980px;margin:0 auto;padding:18px}
  .preview-grid{display:grid;grid-template-columns:minmax(0,440px);justify-content:center;gap:18px;align-items:start;padding-bottom:18px}
  .preview-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .preview-label{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
  .preview-label::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--action)}
  .preview-actions{display:flex;align-items:center;gap:8px}
  .mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 9px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:var(--text)}
  .mini-btn:hover{border-color:var(--action);color:var(--action)}
  .url-line{font-size:12px;color:var(--muted);background:#f8fafc;border:1px solid #e8edf4;border-radius:9px;padding:8px 10px;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tenant-warning{display:none;font-size:12px;color:#7a5500;background:#fff7e7;border:1px solid #f0d49a;border-radius:9px;padding:8px 10px;margin-bottom:12px}
  .tenant-warning.visible{display:block}
  .phone-shell{width:414px;margin:0 auto;background:#101217;border-radius:34px;padding:14px 12px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 16px 34px rgba(15,23,42,.2)}
  .phone-top{width:112px;height:5px;background:#2d3340;border-radius:999px;margin:0 auto 10px}
  .mobile-frame{width:390px;height:844px;border:0;border-radius:22px;background:#fff;display:block}
  @media(max-width:980px){
    body{padding-top:160px}
    .topbar-inner{align-items:flex-start;flex-direction:column}
    .title-wrap{min-width:0}
    .controls{width:100%}
    .tenant-input{width:min(100%,320px)}
    .preview-grid{grid-template-columns:1fr;overflow-x:auto}
  }
  @media(max-width:480px){
    body{padding-top:210px}
    .workspace{padding:12px}
    .preview-card{padding:10px}
    .phone-shell{width:100%;min-width:414px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="title-wrap">
      <h1>Preview mobile do template público</h1>
      <div class="notice">Ferramenta interna. Não publicar como loja.</div>
    </div>
    <div class="controls">
      <label>
        Tenant ID
        <input class="tenant-input" id="tenant-input" type="text" placeholder="tenantId">
      </label>
      <label>
        Idioma
        <select id="lang-select">
          <option value="es-ES">es-ES</option>
          <option value="pt-BR">pt-BR</option>
          <option value="pt-PT">pt-PT</option>
          <option value="en">en</option>
          <option value="fr">fr</option>
        </select>
      </label>
      <button class="btn btn-primary" type="button" id="refresh-all">Atualizar preview</button>
      <button class="btn btn-secondary" type="button" id="open-store">Abrir loja em nova aba</button>
    </div>
  </div>
</header>

<main class="workspace">
  <section class="preview-grid" id="preview-grid">
    <article class="preview-card" id="mobile-card">
      <div class="preview-head">
        <div class="preview-label">Mobile</div>
        <div class="preview-actions">
          <button class="mini-btn" type="button" id="refresh-mobile">Recarregar preview</button>
        </div>
      </div>
      <div class="url-line" id="mobile-url"></div>
      <div class="tenant-warning" id="tenant-warning">Informe um Tenant ID para carregar uma loja específica. Sem tenant, o preview usa o fallback local do template.</div>
      <div class="phone-shell">
        <div class="phone-top"></div>
        <iframe class="mobile-frame" id="mobile-frame" title="Preview mobile do template público"></iframe>
      </div>
    </article>
  </section>
</main>

<script>
  const tenantInput=document.getElementById('tenant-input');
  const langSelect=document.getElementById('lang-select');
  const mobileFrame=document.getElementById('mobile-frame');
  const mobileUrl=document.getElementById('mobile-url');
  const tenantWarning=document.getElementById('tenant-warning');

  function params(){
    const p=new URLSearchParams(window.location.search);
    return {
      tenant:p.get('tenant')||p.get('tenantId')||p.get('uid')||'',
      lang:p.get('lang')||'es-ES'
    };
  }

  function buildStoreUrl(){
    const tenant=tenantInput.value.trim();
    const lang=langSelect.value;
    const q=new URLSearchParams();
    if(tenant)q.set('tenant',tenant);
    if(lang)q.set('lang',lang);
    q.set('_previewTs',String(Date.now()));
    const suffix=q.toString();
    return 'index.html'+(suffix?'?'+suffix:'');
  }

  function syncAddressBar(){
    const q=new URLSearchParams();
    if(tenantInput.value.trim())q.set('tenant',tenantInput.value.trim());
    q.set('lang',langSelect.value);
    history.replaceState(null,'','preview-template.html?'+q.toString());
  }

  function loadFrame(){
    const url=buildStoreUrl();
    tenantWarning.classList.toggle('visible',!tenantInput.value.trim());
    mobileFrame.src='about:blank';
    requestAnimationFrame(()=>{mobileFrame.src=url;});
    mobileUrl.textContent=url;
    mobileUrl.title=url;
  }

  function refreshAll(){
    syncAddressBar();
    loadFrame();
  }

  document.getElementById('refresh-all').addEventListener('click',refreshAll);
  document.getElementById('refresh-mobile').addEventListener('click',loadFrame);
  document.getElementById('open-store').addEventListener('click',()=>window.open(buildStoreUrl(),'_blank','noopener'));
  langSelect.addEventListener('change',refreshAll);
  tenantInput.addEventListener('keydown',event=>{if(event.key==='Enter')refreshAll();});
  let tenantTimer=null;
  tenantInput.addEventListener('input',()=>{
    clearTimeout(tenantTimer);
    tenantTimer=setTimeout(refreshAll,450);
  });

  const initial=params();
  tenantInput.value=initial.tenant;
  langSelect.value=['es-ES','pt-BR','pt-PT','en','fr'].includes(initial.lang)?initial.lang:'es-ES';
  refreshAll();
</script>
</body>
</html>
