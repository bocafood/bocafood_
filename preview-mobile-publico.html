<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview mobile público</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4efe7;color:#211b18}
    .bar{position:sticky;top:0;z-index:10;background:rgba(255,250,243,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(33,27,24,.09)}
    .bar-inner{max-width:1040px;margin:0 auto;padding:14px 18px;display:flex;align-items:end;gap:12px;flex-wrap:wrap}
    .title{margin-right:auto;min-width:240px}
    .title strong{display:block;font-size:16px;font-weight:850}
    .title span{display:block;margin-top:3px;color:#766f68;font-size:12px;font-weight:650}
    label{display:grid;gap:5px;color:#766f68;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}
    input,select{height:38px;border:1px solid rgba(33,27,24,.12);border-radius:10px;background:#fff;color:#211b18;padding:0 11px;font:inherit;font-size:13px;outline:none}
    input{width:min(360px,70vw)}
    button,a{height:38px;border:1px solid rgba(33,27,24,.12);border-radius:10px;background:#fff;color:#211b18;padding:0 13px;font:inherit;font-size:13px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .primary{background:#8f1d1d;color:#fff;border-color:#8f1d1d}
    .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 34px;display:grid;justify-content:center}
    .url{width:min(430px,100%);margin:0 auto 12px;padding:9px 11px;border:1px solid rgba(33,27,24,.09);border-radius:12px;background:rgba(255,255,255,.66);color:#766f68;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .phone{width:430px;max-width:calc(100vw - 28px);height:900px;max-height:calc(100vh - 160px);min-height:680px;padding:12px;border-radius:46px;background:#15100e;box-shadow:0 26px 70px rgba(33,27,24,.18)}
    .screen{width:100%;height:100%;border:0;border-radius:36px;background:#fff;display:block}
    @media(max-width:720px){
      .bar-inner{align-items:stretch}
      .title{width:100%}
      input{width:100%}
      button,a,select{width:100%}
      label{width:100%}
      .phone{height:820px;max-height:none}
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div class="title">
        <strong>Preview mobile da loja pública</strong>
        <span>Abre o `index.html` publicado dentro de uma moldura mobile.</span>
      </div>
      <label>Tenant ID
        <input id="tenant" value="MZDs5MEb9gNbX4q5xdRYVgzlL252" spellcheck="false">
      </label>
      <label>Idioma
        <select id="lang">
          <option value="es-ES">es-ES</option>
          <option value="pt-BR">pt-BR</option>
          <option value="pt-PT">pt-PT</option>
          <option value="en">en</option>
          <option value="fr">fr</option>
        </select>
      </label>
      <button class="primary" id="reload" type="button">Recarregar</button>
      <a id="open" href="#" target="_blank" rel="noopener">Abrir loja</a>
    </div>
  </header>

  <main class="wrap">
    <div class="url" id="url"></div>
    <div class="phone">
      <iframe class="screen" id="frame" title="Preview mobile público"></iframe>
    </div>
  </main>

  <script>
    const tenantEl=document.getElementById('tenant');
    const langEl=document.getElementById('lang');
    const frame=document.getElementById('frame');
    const urlEl=document.getElementById('url');
    const openEl=document.getElementById('open');

    function readInitial(){
      const p=new URLSearchParams(location.search);
      tenantEl.value=p.get('tenant')||p.get('tenantId')||p.get('uid')||tenantEl.value;
      langEl.value=p.get('lang')||'es-ES';
    }

    function storeUrl(){
      const q=new URLSearchParams();
      const tenant=tenantEl.value.trim();
      if(tenant)q.set('tenant',tenant);
      q.set('lang',langEl.value);
      q.set('_previewTs',Date.now().toString());
      return 'index.html?'+q.toString();
    }

    function syncPreviewUrl(){
      const q=new URLSearchParams();
      const tenant=tenantEl.value.trim();
      if(tenant)q.set('tenant',tenant);
      q.set('lang',langEl.value);
      history.replaceState(null,'','preview-mobile-publico.html?'+q.toString());
    }

    function load(){
      syncPreviewUrl();
      const url=storeUrl();
      urlEl.textContent=url;
      urlEl.title=url;
      openEl.href=url;
      frame.src='about:blank';
      requestAnimationFrame(()=>{frame.src=url;});
    }

    document.getElementById('reload').addEventListener('click',load);
    langEl.addEventListener('change',load);
    tenantEl.addEventListener('keydown',event=>{if(event.key==='Enter')load();});
    let timer=null;
    tenantEl.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,500);});
    readInitial();
    load();
  </script>
</body>
</html>
