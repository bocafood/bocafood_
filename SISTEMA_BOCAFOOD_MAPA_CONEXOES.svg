  <path class="edge" d="M455 302 C345 250 305 230 325 212"/>
  <rect class="label-bg" x="352" y="257" width="118" height="22" rx="8"/><text class="label" x="362" y="273">catalogo</text>
  <path class="edge" d="M545 334 C700 420 830 415 975 417"/>
  <rect class="label-bg" x="706" y="385" width="108" height="22" rx="8"/><text class="label" x="716" y="401">imagens</text>
  <path class="edge" d="M575 492 L665 492"/>
  <rect class="label-bg" x="593" y="468" width="76" height="22" rx="8"/><text class="label" x="603" y="484">custos</text>
  <path class="edge" d="M545 524 L545 555"/>
  <rect class="label-bg" x="560" y="533" width="120" height="22" rx="8"/><text class="label" x="570" y="549">contas</text>
  <path class="edge" d="M845 587 C900 587 920 307 975 307"/>
  <rect class="label-bg" x="860" y="545" width="96" height="22" rx="8"/><text class="label" x="870" y="561">campanhas</text>
  <path class="edge" d="M755 619 C850 694 910 712 980 712"/>
  <rect class="label-bg" x="825" y="665" width="96" height="22" rx="8"/><text class="label" x="835" y="681">vendas</text>
  <path class="edge" d="M755 619 C920 640 1080 675 1245 712"/>
  <rect class="label-bg" x="962" y="650" width="116" height="22" rx="8"/><text class="label" x="972" y="666">recorrencia</text>
