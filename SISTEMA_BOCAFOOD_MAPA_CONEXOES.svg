  <rect class="label-bg" x="405" y="336" width="86" height="22" rx="8"/><text class="label" x="415" y="352">pedido WA</text>
  <path class="edge" d="M325 212 C620 120 885 300 975 307"/>
  <rect class="label-bg" x="548" y="154" width="122" height="22" rx="8"/><text class="label" x="558" y="170">cria orders</text>
  <path class="edge" d="M845 302 C900 302 920 307 975 307"/>
  <rect class="label-bg" x="875" y="282" width="74" height="22" rx="8"/><text class="label" x="884" y="298">orders</text>
  <path class="edge" d="M975 307 C920 330 895 397 845 397"/>
  <rect class="label-bg" x="886" y="358" width="94" height="22" rx="8"/><text class="label" x="895" y="374">clientes</text>
  <path class="edge" d="M755 334 L755 365"/>
  <path class="edge" d="M665 302 C620 338 575 365 545 365"/>
