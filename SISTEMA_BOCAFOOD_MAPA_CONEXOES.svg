  <text class="sub" x="1268" y="622">historico e canais</text>
  <rect class="node intel" x="980" y="680" width="200" height="64" rx="14"/>
  <text class="title" x="1003" y="707">Temporadas</text>
  <text class="sub" x="1003" y="727">score, risco, resultado</text>
  <rect class="node intel" x="1245" y="680" width="200" height="64" rx="14"/>
  <text class="title" x="1268" y="707">Maturidade / Pedras</text>
  <text class="sub" x="1268" y="727">progresso acumulado</text>
  <rect class="node intel" x="1112" y="785" width="200" height="54" rx="14"/>
  <text class="title" x="1135" y="817">IA / Proxima Jogada</text>

  <rect class="layer" x="40" y="510" width="335" height="360" rx="18"/>
  <text class="layer-title" x="65" y="545">Integracoes externas</text>
  <rect class="node ext" x="70" y="575" width="255" height="64" rx="14"/>
  <text class="title" x="92" y="602">Master interno</text>
  <text class="sub" x="92" y="622">master.html</text>
  <rect class="node ext" x="70" y="670" width="255" height="64" rx="14"/>
  <text class="title" x="92" y="697">Google Places</text>
  <text class="sub" x="92" y="717">condicional por system/config</text>
  <rect class="node ext" x="70" y="765" width="255" height="64" rx="14"/>
  <text class="title" x="92" y="792">GitHub / API local</text>
  <text class="sub" x="92" y="812">publicacao via Master</text>

