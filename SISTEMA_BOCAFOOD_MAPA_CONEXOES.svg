  <text class="sub" x="478" y="412">status operacional</text>
  <rect class="node admin" x="665" y="365" width="180" height="64" rx="14"/>
  <text class="title" x="688" y="392">Clientes</text>
  <text class="sub" x="688" y="412">store_customers</text>
  <rect class="node admin" x="455" y="460" width="180" height="64" rx="14"/>
  <text class="title" x="478" y="487">Compras</text>
  <text class="sub" x="478" y="507">fornecedores, insumos</text>
