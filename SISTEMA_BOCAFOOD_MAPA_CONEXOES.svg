  <text class="sub" x="478" y="317">produtos e categorias</text>
  <rect class="node admin" x="665" y="270" width="180" height="64" rx="14"/>
  <text class="title" x="688" y="297">Pedidos</text>
  <text class="sub" x="688" y="317">orders</text>
  <rect class="node admin" x="455" y="365" width="180" height="64" rx="14"/>
