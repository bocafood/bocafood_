  <text class="title" x="478" y="582">Financeiro</text>
  <text class="sub" x="478" y="602">caixa, contas</text>
  <rect class="node admin" x="665" y="555" width="180" height="64" rx="14"/>
  <text class="title" x="688" y="582">Marketing</text>
  <text class="sub" x="688" y="602">cupons, upsell, pontos</text>

  <rect class="layer" x="940" y="110" width="290" height="360" rx="18"/>
  <text class="layer-title" x="965" y="145">Camada de dados</text>
  <rect class="node data" x="975" y="175" width="220" height="64" rx="14"/>
