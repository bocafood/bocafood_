  <path class="edge" d="M1080 639 L1080 680"/>
  <path class="edge" d="M1180 712 L1245 712"/>
  <rect class="label-bg" x="1192" y="688" width="70" height="22" rx="8"/><text class="label" x="1202" y="704">score</text>
  <path class="edge" d="M1345 744 C1345 795 1185 862 1085 744"/>
  <rect class="label-bg" x="1208" y="818" width="128" height="22" rx="8"/><text class="label" x="1218" y="834">snapshots</text>
  <path class="edge-soft" d="M1080 744 C1100 770 1135 780 1188 785"/>
  <rect class="label-bg" x="1038" y="760" width="118" height="22" rx="8"/><text class="label" x="1048" y="776">recomendacao</text>
  <path class="edge" d="M325 607 C500 570 815 330 975 307"/>
  <rect class="label-bg" x="515" y="497" width="130" height="22" rx="8"/><text class="label" x="525" y="513">tenants/config</text>
  <path class="edge" d="M325 702 C400 710 590 250 665 207"/>
  <rect class="label-bg" x="392" y="590" width="110" height="22" rx="8"/><text class="label" x="402" y="606">enderecos</text>
  <path class="edge-soft" d="M325 797 C385 780 410 742 455 704"/>
  <rect class="label-bg" x="350" y="746" width="122" height="22" rx="8"/><text class="label" x="360" y="762">publicacao</text>

  <rect x="60" y="925" width="1480" height="95" rx="16" fill="#fff" stroke="#e6ded4" stroke-width="2"/>
  <text x="85" y="958" style="font:700 16px Arial,sans-serif;fill:#1f1f1f">Notas</text>
  <text x="85" y="984" style="font:400 13px Arial,sans-serif;fill:#6f6860">Conexoes tracejadas indicam preparacao/futuro ou dependencia condicional. O Hosting publica somente public/. Firestore deve sempre respeitar tenants/{tenantId}.</text>
  <text x="85" y="1008" style="font:400 13px Arial,sans-serif;fill:#6f6860">IA de Temporadas esta preparada por endpoint configuravel; Google Places depende de chave global em system/config; financeiro ainda exige normalizacao para calculos definitivos.</text>
</svg>
