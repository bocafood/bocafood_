<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Sistema BocaFood - Mapa de Conexoes</title>
  <desc id="desc">Diagrama visual das conexoes entre camada publica, Admin, Firestore, Storage, Master, integracoes externas e inteligencia de negocio.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf8}
      .layer{fill:#fff;stroke:#e6ded4;stroke-width:2}
      .layer-title{font:700 20px Arial,sans-serif;fill:#1f1f1f}
      .node{fill:#fff;stroke:#d9d1c7;stroke-width:2}
      .public{fill:#fff8ec;stroke:#d97706}
      .admin{fill:#f8fafc;stroke:#64748b}
      .data{fill:#eef2ff;stroke:#2563eb}
      .intel{fill:#f0fdf4;stroke:#1a9e5a}
      .ext{fill:#faf5ff;stroke:#7c3aed}
      .title{font:700 16px Arial,sans-serif;fill:#1f1f1f}
      .sub{font:400 12px Arial,sans-serif;fill:#6f6860}
      .edge{stroke:#6f6860;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .edge-soft{stroke:#9a8f87;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow-soft)}
      .label{font:700 12px Arial,sans-serif;fill:#534b45}
      .label-bg{fill:#fbfaf8;stroke:#eadfd4;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6860"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a8f87"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text x="60" y="52" style="font:800 30px Arial,sans-serif;fill:#1f1f1f">BocaFood - Mapa visual de conexoes</text>
  <text x="60" y="78" style="font:400 14px Arial,sans-serif;fill:#6f6860">Admin, template publico, Firestore, Storage, Master, integracoes e inteligencia de crescimento.</text>

  <rect class="layer" x="40" y="110" width="335" height="360" rx="18"/>
  <text class="layer-title" x="65" y="145">Camada publica</text>
  <rect class="node public" x="70" y="175" width="255" height="74" rx="14"/>
  <text class="title" x="92" y="205">Template publico</text>
  <text class="sub" x="92" y="226">public/index.html</text>
  <rect class="node public" x="70" y="280" width="255" height="74" rx="14"/>
  <text class="title" x="92" y="310">Paginas publicas</text>
  <text class="sub" x="92" y="331">review.html, track.html, SEO</text>
  <rect class="node public" x="70" y="385" width="255" height="54" rx="14"/>
  <text class="title" x="92" y="418">WhatsApp</text>

  <rect class="layer" x="420" y="110" width="470" height="760" rx="18"/>
  <text class="layer-title" x="445" y="145">Camada Admin</text>
  <rect class="node admin" x="455" y="175" width="180" height="64" rx="14"/>
  <text class="title" x="478" y="202">Admin</text>
  <text class="sub" x="478" y="222">public/admin.html</text>
  <rect class="node admin" x="665" y="175" width="180" height="64" rx="14"/>
  <text class="title" x="688" y="202">Configuracoes</text>
  <text class="sub" x="688" y="222">config/*</text>
  <rect class="node admin" x="455" y="270" width="180" height="64" rx="14"/>
