  <text class="sub" x="998" y="222">login e UID</text>
  <rect class="node data" x="975" y="270" width="220" height="74" rx="14"/>
  <text class="title" x="998" y="298">Firestore</text>
  <text class="sub" x="998" y="318">tenants/{tenantId} + system</text>
  <rect class="node data" x="975" y="385" width="220" height="64" rx="14"/>
  <text class="title" x="998" y="412">Storage</text>
  <text class="sub" x="998" y="432">imagens e assets</text>

