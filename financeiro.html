<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro — BOCA Food</title>
<meta http-equiv="refresh" content="0; url=admin.html#financeiro/visao-geral">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FBF5F3;
    color:#1A1A1A;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  main{
    width:min(420px,calc(100% - 40px));
    background:#fff;
    border:1px solid #F2EDED;
    border-radius:14px;
    padding:24px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    text-align:center;
  }
  h1{
    margin:0 0 8px;
    font-size:22px;
  }
  p{
    margin:0 0 18px;
    color:#8A7E7C;
    font-size:14px;
    line-height:1.5;
  }
  a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:0 16px;
    border-radius:10px;
    background:#C4362A;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:800;
  }
  a:hover{background:#9E2418}
</style>
</head>
<body>
<main>
  <h1>Financeiro</h1>
  <p>Redirecionando para a tela financeira oficial do painel.</p>
  <a id="financeiro-link" href="admin.html#financeiro/visao-geral">Abrir financeiro</a>
</main>
<script>
(function () {
  'use strict';
  var target = 'admin.html' + window.location.search + '#financeiro/visao-geral';
  var link = document.getElementById('financeiro-link');
  if (link) link.href = target;
  window.location.replace(target);
})();
</script>
</body>
</html>
