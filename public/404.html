<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página não encontrada — BocaFood</title>
    <link rel="icon" type="image/png" href="/assets/boca-food-favicon.png">
    <link rel="apple-touch-icon" href="/assets/boca-food-favicon.png">

    <style media="screen">
      * { box-sizing: border-box; }
      body { min-height: 100vh; background: linear-gradient(180deg,#FCF7F5 0%,#FFF9F7 100%); color: #2D2321; font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; display: grid; place-items: center; }
      #message { background: white; width: min(420px, 100%); padding: 30px 26px; border: 1px solid #EFE4E1; border-radius: 22px; box-shadow: 0 18px 46px rgba(31,31,31,.08); text-align: center; }
      #message img { width: 118px; height: auto; display: block; margin: 0 auto 12px; }
      #message h2 { color: #B42318; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; }
      #message h1 { font-size: 24px; font-weight: 750; color: #261D1A; margin: 0 0 10px; line-height: 1.2; }
      #message p { line-height: 1.55; margin: 0 0 20px; font-size: 14px; color: #7B6E6A; }
      #message a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; background: #B42318; text-decoration: none; color: white; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 800; }
      @media (max-width: 600px) {
        body { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <img src="/assets/boca-food-logo.png" alt="BocaFood">
      <h2>404</h2>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou foi movido.</p>
      <a href="/login">Ir para o Centro de Controle</a>
    </div>
  </body>
</html>
