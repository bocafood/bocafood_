<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — BocaFood</title>
<link rel="icon" type="image/png" href="/assets/boca-food-favicon.png">
<link rel="apple-touch-icon" href="/assets/boca-food-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#B42318;
  --red-dark:#8F1E14;
  --dark:#1F1F1F;
  --muted:#6F6860;
  --mid:#D9D1C7;
  --line:#EAE4DA;
  --soft:#FBF5F3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#fff;
  color:var(--dark);
  font-family:'Manrope','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.5;
}
button,input{font-family:inherit}
.reset-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  background:
    radial-gradient(circle at 18% 12%, rgba(180,35,24,.08), transparent 34%),
    linear-gradient(135deg,#FBF5F3 0%,#FFF8F6 48%,#FFF 100%);
}
.reset-card{
  width:min(430px,100%);
  background:#fff;
  border:1px solid rgba(180,35,24,.10);
  border-radius:22px;
  box-shadow:0 18px 60px rgba(31,31,31,.10);
  padding:30px;
}
.reset-brand{
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 0;
}
.reset-brand img{
  width:min(248px,82%);
  height:102px;
  object-fit:contain;
}
.reset-kicker{
  display:block;
  margin:-2px 0 6px;
  color:var(--red);
  font-size:11px;
  font-weight:800;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.reset-title{
  font-size:24px;
  font-weight:700;
  line-height:1.16;
  text-align:center;
  color:var(--dark);
  margin:0 0 7px;
}
.reset-copy{
  max-width:330px;
  margin:0 auto 18px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  text-align:center;
}
.reset-message{
  display:none;
  margin:0 0 12px;
  padding:10px 12px;
  border-radius:10px;
  background:#FCEDE9;
  color:var(--red);
  font-size:13px;
  font-weight:650;
}
.reset-message.success{
  display:block;
  background:#F0FAF3;
  color:#1A7F4C;
}
.reset-message.error{display:block}
.reset-form[hidden],.reset-loading[hidden],.reset-success[hidden]{display:none}
.reset-loading{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  background:#FFFCFA;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
.reset-field{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:14px;
}
.reset-field span{
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  letter-spacing:.28px;
  text-transform:uppercase;
}
.reset-field input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--mid);
  border-radius:10px;
  background:#fff;
  color:var(--dark);
  font-size:14px;
  outline:none;
}
.reset-field input:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(180,35,24,.08);
}
.reset-email-note{
  margin:-2px 0 14px;
  color:#8A8179;
  font-size:12px;
  text-align:center;
}
.reset-submit{
  width:100%;
  border:none;
  background:var(--red);
  color:#fff;
  border-radius:11px;
  padding:13px 16px;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(180,35,24,.13);
}
.reset-submit:hover{background:var(--red-dark)}
.reset-submit:disabled{opacity:.72;cursor:not-allowed}
.reset-secondary{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:42px;
  margin-top:10px;
  border:1px solid #E3DAD1;
  background:#fff;
  color:#2A2620;
  border-radius:12px;
  font-size:13px;
  font-weight:750;
  text-decoration:none;
}
.reset-small{
  margin-top:12px;
  color:#8A8179;
  font-size:12px;
  text-align:center;
}
@media (max-width:520px){
  .reset-screen{padding:18px}
  .reset-card{padding:24px 20px;border-radius:20px}
  .reset-brand img{width:min(220px,86%);height:90px}
  .reset-title{font-size:22px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
<main class="reset-screen">
  <section class="reset-card" aria-labelledby="reset-title">
    <div class="reset-brand"><img src="/assets/boca-food-logo.png" alt="BocaFood"></div>
    <span class="reset-kicker">Redefinir senha</span>
    <h1 id="reset-title" class="reset-title">Crie uma nova senha</h1>
    <p class="reset-copy">Informe uma nova senha para voltar a acessar seu Centro de Controle.</p>

    <div id="reset-loading" class="reset-loading">Validando link de recuperação...</div>
    <div id="reset-message" class="reset-message"></div>

    <form id="reset-form" class="reset-form" hidden>
      <p id="reset-email-note" class="reset-email-note"></p>
      <label class="reset-field">
        <span>Nova senha</span>
        <input id="new-password" type="password" autocomplete="new-password" placeholder="Digite a nova senha" minlength="6" required>
      </label>
      <label class="reset-field">
        <span>Confirmar senha</span>
        <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Repita a nova senha" minlength="6" required>
      </label>
      <button id="reset-submit" class="reset-submit" type="submit">Salvar nova senha</button>
      <p class="reset-small">Use pelo menos 6 caracteres.</p>
    </form>

    <div id="reset-success" class="reset-success" hidden>
      <a class="reset-submit reset-secondary" href="/login">Entrar no Centro de Controle</a>
    </div>

    <a class="reset-secondary" href="/login">Voltar ao login</a>
  </section>
</main>

<script>
(function () {
  'use strict';

  var BB_FB_CFG = {
    apiKey: 'AIzaSyAZk2mEPXR-VQOOEJWfcdhqoJOhHWjzda4',
    authDomain: 'bocado-brasil.firebaseapp.com',
    projectId: 'bocado-brasil',
    storageBucket: 'bocado-brasil.firebasestorage.app',
    messagingSenderId: '1083383234261',
    appId: '1:1083383234261:web:b73a9e9f7df73233d6ec5c'
  };

  if (!firebase.apps.length) firebase.initializeApp(BB_FB_CFG);

  var auth = firebase.auth();
  var form = document.getElementById('reset-form');
  var loading = document.getElementById('reset-loading');
  var message = document.getElementById('reset-message');
  var submit = document.getElementById('reset-submit');
  var success = document.getElementById('reset-success');
  var emailNote = document.getElementById('reset-email-note');
  var oobCode = getParam('oobCode');

  function getParam(name) {
    var search = new URLSearchParams(window.location.search || '');
    if (search.has(name)) return search.get(name);
    var hash = String(window.location.hash || '').replace(/^#/, '');
    var hashQuery = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?') + 1) : hash;
    var hashParams = new URLSearchParams(hashQuery || '');
    return hashParams.get(name) || '';
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'reset-message ' + (type || 'error');
  }

  function hideLoading() {
    loading.hidden = true;
  }

  if (!oobCode) {
    hideLoading();
    showMessage('Link de recuperação inválido. Solicite um novo link pelo login.', 'error');
    return;
  }

  auth.verifyPasswordResetCode(oobCode).then(function (email) {
    hideLoading();
    form.hidden = false;
    emailNote.textContent = email ? 'Redefinindo a senha de ' + email + '.' : '';
    setTimeout(function () {
      var input = document.getElementById('new-password');
      if (input) input.focus();
    }, 30);
  }).catch(function () {
    hideLoading();
    showMessage('Este link expirou ou já foi usado. Solicite um novo link pelo login.', 'error');
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var password = document.getElementById('new-password').value;
    var confirmPassword = document.getElementById('confirm-password').value;

    message.className = 'reset-message';
    message.textContent = '';

    if (!password || password.length < 6) {
      showMessage('A nova senha precisa ter pelo menos 6 caracteres.', 'error');
      return;
    }
    if (password !== confirmPassword) {
      showMessage('As senhas não conferem. Digite a mesma senha nos dois campos.', 'error');
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Salvando...';
    auth.confirmPasswordReset(oobCode, password).then(function () {
      form.hidden = true;
      success.hidden = false;
      showMessage('Senha redefinida com sucesso. Agora você já pode entrar no Centro de Controle.', 'success');
    }).catch(function () {
      showMessage('Não foi possível redefinir a senha. Solicite um novo link pelo login.', 'error');
    }).finally(function () {
      submit.disabled = false;
      submit.textContent = 'Salvar nova senha';
    });
  });
})();
</script>
</body>
</html>
