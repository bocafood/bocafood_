<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro BocaFood</title>
  <link rel="icon" type="image/png" href="/assets/boca-food-favicon.png">
  <link rel="apple-touch-icon" href="/assets/boca-food-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
  <style>
    :root{
      --red:#C4362A;
      --red-soft:#FFF4F2;
      --ink:#2D2321;
      --muted:#7B6E6A;
      --line:#EFE4E1;
      --bg:#FFF9F7;
      --green:#2F6B57;
      --shadow:0 14px 36px rgba(31,31,31,.06);
      --content-width:760px;
      --content-pad:24px;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:'Manrope','Inter',sans-serif;background:linear-gradient(180deg,#FCF7F5 0%,#FFF9F7 100%);color:var(--ink)}
    .topbar{width:min(var(--content-width),100%);margin:0 auto;padding:4px var(--content-pad) 0;display:flex;align-items:center;justify-content:center}
    .brand-logo{width:104px;height:auto;object-fit:contain;background:transparent;border:0;padding:0}
    .page{min-height:calc(100vh - 44px);display:block;width:min(900px,100%);margin:0 auto;padding:0 24px 24px}
    .page-title,.preview-banner,.progress-card,.panel{width:min(var(--content-width),100%);margin-left:auto;margin-right:auto}
    .page-title{margin-top:-10px;margin-bottom:10px;padding:0 var(--content-pad)}
    .page-kicker{display:block;color:var(--red);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:0}
    .page-title h1{font-size:31px;line-height:1.08;margin:0 0 8px;font-weight:700;letter-spacing:0;color:#261D1A}
    .page-title p{font-size:14px;line-height:1.5;color:var(--muted);margin:0;max-width:640px}
    .preview-banner{display:none;margin-top:0;margin-bottom:10px;padding:7px 10px;border:1px solid #EFE4E1;background:#FFFCFB;color:#9A8D89;border-radius:12px;font-size:11px;line-height:1.35}
    .preview-banner.show{display:block}
    .progress-card{position:relative;margin-top:0;margin-bottom:12px;background:linear-gradient(135deg,#FFFFFF 0%,#FAF8F4 100%);border:1px solid #EAE4DA;border-radius:18px;padding:12px var(--content-pad) 11px;box-shadow:0 14px 36px rgba(31,31,31,.06);overflow:hidden}
    .progress-card::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--red),#B6925E)}
    .progress-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:#776A66;font-weight:700;margin-bottom:7px}
    .progress-bar{height:5px;border-radius:999px;background:#EFE8DF;overflow:hidden;box-shadow:inset 0 1px 2px rgba(31,31,31,.08)}
    .progress-fill{height:100%;width:14.28%;border-radius:999px;background:linear-gradient(90deg,var(--red),#B6925E);box-shadow:0 0 10px rgba(180,35,24,.18);transition:width .18s ease}
    .step-pills{display:none}
    .panel{position:relative;background:linear-gradient(135deg,#FFFFFF 0%,#FAF8F4 100%);border:1px solid #EAE4DA;border-radius:22px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .panel::before{content:'';position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,rgba(196,54,42,.42),rgba(182,146,94,.34))}
    .question{font-family:'Manrope','Inter',sans-serif;font-size:24px;line-height:1.16;margin:22px 24px 7px;font-weight:700;letter-spacing:0;color:#261D1A}
    .hint{font-size:13px;line-height:1.45;color:var(--muted);margin:0 24px 8px;max-width:620px}
    .step-note{font-size:12px;line-height:1.42;color:#8A7D79;margin:0 22px 12px;display:none}
    .step-note.show{display:block}
    .step-main{padding:0 24px 10px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .responsible-grid{grid-template-columns:minmax(0,1.35fr) minmax(190px,.85fr)}
    .responsible-block{grid-column:1/-1;display:grid;grid-template-columns:inherit;gap:12px;padding-top:2px}
    .responsible-block + .responsible-block{margin-top:2px;padding-top:12px;border-top:1px solid rgba(239,228,225,.86)}
    .responsible-block-title{grid-column:1/-1;margin:0 0 -2px;color:#8A7E7A;font-size:10.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
    .store-step{gap:14px}
    .signup-section{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:2px}
    .boxed-step{gap:12px}
    .boxed-step .signup-section{padding:13px 14px 14px;border:1px solid rgba(196,54,42,.24);border-radius:17px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFCFB 100%);gap:10px}
    .boxed-step .signup-section-title{font-size:11px;font-weight:900;color:#473D3A}
    .boxed-step .signup-section-help{font-size:11.5px;color:#9A8D89}
    .business-step .signup-section{border-color:#ECE2DE;background:linear-gradient(135deg,#FFFFFF 0%,#FFFEFD 100%)}
    .business-step .signup-section-title{color:#5B504C;font-weight:850}
    .business-step .choice{border-color:#E6DDD9;background:#fff;color:#4D423F;font-weight:650}
    .business-step .choice:has(input:checked){border-color:rgba(196,54,42,.72);background:#FFF5F2;box-shadow:0 0 0 3px rgba(196,54,42,.045)}
    .sales-step{gap:12px}
    .sales-map-step{gap:10px}
    .sales-map-step .signup-section{border-color:#ECE2DE;background:linear-gradient(135deg,#FFFFFF 0%,#FFFEFD 100%);padding:11px 12px 12px;gap:8px}
    .sales-map-step .signup-section-title{color:#5B504C;font-weight:850}
    .sales-ruler{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding-top:6px}
    .sales-ruler::before{content:'';position:absolute;left:9%;right:9%;top:17px;height:1px;background:#E9DED9}
    .sales-ruler-option{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 2px;color:#625652;font-size:11.2px;font-weight:720;text-align:center;line-height:1.18;cursor:pointer}
    .sales-ruler-option input{position:absolute;opacity:0;pointer-events:none}
    .sales-ruler-dot{width:12px;height:12px;border-radius:999px;background:#fff;border:1.5px solid #DCCFCB;display:block;box-shadow:0 3px 8px rgba(31,31,31,.035)}
    .sales-ruler-option:has(input:checked){color:#3F3430}
    .sales-ruler-option:has(input:checked) .sales-ruler-dot{width:14px;height:14px;border-color:var(--red);background:var(--red);box-shadow:0 6px 12px rgba(196,54,42,.13)}
    .sales-channel-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
    .sales-channel-grid .choice{gap:7px;min-height:36px;padding:7px 30px 7px 10px}
    .menu-status-grid{grid-template-columns:1fr}
    .menu-status-grid .choice{min-height:36px;justify-content:flex-start;text-align:left;padding-top:7px;padding-bottom:7px}
    .sales-map-step .choice{border-color:#E6DDD9;background:#fff;color:#4D423F;font-weight:650}
    .sales-map-step .choice span{text-transform:none;letter-spacing:0;color:#4D423F;font-size:12.4px;font-weight:650}
    .sales-map-step .choice:has(input:checked){border-color:rgba(196,54,42,.72);background:#FFF5F2;box-shadow:0 0 0 3px rgba(196,54,42,.04)}
    .sales-map-summary{grid-column:1/-1;margin-top:0;padding:11px 12px;border:1px solid #EDE3DF;border-radius:15px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFCFB 100%);color:#5A4E4A}
    .sales-map-summary-title{font-size:10.8px;font-weight:850;letter-spacing:.055em;text-transform:uppercase;color:#5B504C;margin-bottom:7px}
    .sales-map-summary-text{font-size:12px;line-height:1.48;color:#7D706C;margin:0}
    .sales-map-summary-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;font-size:11.8px;line-height:1.35}
    .sales-map-summary-list li{padding:6px 8px;border:1px solid #EFE4E1;border-radius:999px;background:#fff;color:#6E625E}
    .sales-map-summary-list strong{color:#3F3430;font-weight:850}
    .operation-step{gap:10px}
    .operation-step .signup-section{border-color:#ECE2DE;background:linear-gradient(135deg,#FFFFFF 0%,#FFFEFD 100%);padding:11px 12px 12px;gap:8px}
    .operation-step .signup-section-title{color:#5B504C;font-weight:850}
    .operation-step .choice{border-color:#E6DDD9;background:#fff;color:#4D423F;font-weight:650;min-height:36px;padding:7px 30px 7px 10px}
    .operation-step .choice span{text-transform:none;letter-spacing:0;color:#4D423F;font-size:12.4px;font-weight:650}
    .operation-step .choice:has(input:checked){border-color:rgba(196,54,42,.72);background:#FFF5F2;box-shadow:0 0 0 3px rgba(196,54,42,.04)}
    .operation-chip-grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}
    .operation-ruler{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;padding-top:6px}
    .operation-ruler::before{content:'';position:absolute;left:7%;right:7%;top:17px;height:1px;background:#E9DED9}
    .operation-ruler-option{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 2px;color:#625652;font-size:11.2px;font-weight:720;text-align:center;line-height:1.18;cursor:pointer}
    .operation-ruler-option input{position:absolute;opacity:0;pointer-events:none}
    .operation-ruler-dot{width:12px;height:12px;border-radius:999px;background:#fff;border:1.5px solid #DCCFCB;display:block;box-shadow:0 3px 8px rgba(31,31,31,.035)}
    .operation-ruler-option:has(input:checked){color:#3F3430}
    .operation-ruler-option:has(input:checked) .operation-ruler-dot{width:14px;height:14px;border-color:var(--red);background:var(--red);box-shadow:0 6px 12px rgba(196,54,42,.13)}
    .operation-summary{grid-column:1/-1;margin-top:0;padding:11px 12px;border:1px solid #EDE3DF;border-radius:15px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFCFB 100%);color:#5A4E4A}
    .operation-summary-title{font-size:10.8px;font-weight:850;letter-spacing:.055em;text-transform:uppercase;color:#5B504C;margin-bottom:7px}
    .operation-summary-text{font-size:12px;line-height:1.48;color:#7D706C;margin:0}
    .operation-summary-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;font-size:11.8px;line-height:1.35}
    .operation-summary-list li{padding:6px 8px;border:1px solid #EFE4E1;border-radius:999px;background:#fff;color:#6E625E}
    .operation-summary-list strong{color:#3F3430;font-weight:850}
    .moment-map-step{gap:10px}
    .moment-map-step .signup-section{border-color:#ECE2DE;background:linear-gradient(135deg,#FFFFFF 0%,#FFFEFD 100%);padding:11px 12px 12px;gap:8px}
    .moment-map-step .signup-section-title{color:#5B504C;font-weight:850}
    .moment-map-step .choice{border-color:#E6DDD9;background:#fff;color:#4D423F;font-weight:650;min-height:36px;padding:7px 30px 7px 10px}
    .moment-map-step .choice span{text-transform:none;letter-spacing:0;color:#4D423F;font-size:12.4px;font-weight:650}
    .moment-map-step .choice:has(input:checked){border-color:rgba(196,54,42,.72);background:#FFF5F2;box-shadow:0 0 0 3px rgba(196,54,42,.04)}
    .moment-chip-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
    .moment-ruler{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:7px;padding-top:6px}
    .moment-ruler::before{content:'';position:absolute;left:7%;right:7%;top:17px;height:1px;background:#E9DED9}
    .moment-ruler-option{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 2px;color:#625652;font-size:11.2px;font-weight:720;text-align:center;line-height:1.18;cursor:pointer}
    .moment-ruler-option input{position:absolute;opacity:0;pointer-events:none}
    .moment-ruler-dot{width:12px;height:12px;border-radius:999px;background:#fff;border:1.5px solid #DCCFCB;display:block;box-shadow:0 3px 8px rgba(31,31,31,.035)}
    .moment-ruler-option:has(input:checked){color:#3F3430}
    .moment-ruler-option:has(input:checked) .moment-ruler-dot{width:14px;height:14px;border-color:var(--red);background:var(--red);box-shadow:0 6px 12px rgba(196,54,42,.13)}
    .store-map-step .signup-section{gap:10px}
    .store-map-step .store-fields{gap:10px}
    .store-map-step .choice-grid{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
    .store-map-step .choice{min-height:38px;padding:8px 34px 8px 11px;border-color:#E9DED9;background:#fff;font-size:12.2px;font-weight:700;line-height:1.18}
    .store-map-step .choice span{display:flex;align-items:center;min-height:24px}
    .store-map-summary{grid-column:1/-1;margin-top:0;padding:11px 12px;border:1px solid #EDE3DF;border-radius:15px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFCFB 100%);color:#5A4E4A}
    .store-map-summary-title{font-size:10.8px;font-weight:850;letter-spacing:.055em;text-transform:uppercase;color:#5B504C;margin-bottom:7px}
    .store-map-summary-text{font-size:12px;line-height:1.48;color:#7D706C;margin:0}
    .store-map-summary-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;font-size:11.8px;line-height:1.35}
    .store-map-summary-list li{padding:6px 8px;border:1px solid #EFE4E1;border-radius:999px;background:#fff;color:#6E625E}
    .store-map-summary-list strong{color:#3F3430;font-weight:850}
    .moment-summary{grid-column:1/-1;margin-top:0;padding:11px 12px;border:1px solid #EDE3DF;border-radius:15px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFCFB 100%);color:#5A4E4A}
    .moment-summary-title{font-size:10.8px;font-weight:850;letter-spacing:.055em;text-transform:uppercase;color:#5B504C;margin-bottom:7px}
    .moment-summary-text{font-size:12px;line-height:1.48;color:#7D706C;margin:0}
    .moment-summary-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;font-size:11.8px;line-height:1.35}
    .moment-summary-list li{padding:6px 8px;border:1px solid #EFE4E1;border-radius:999px;background:#fff;color:#6E625E}
    .moment-summary-list strong{color:#3F3430;font-weight:850}
    .signup-section-head{display:flex;flex-direction:column;gap:3px}
    .signup-section-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6D625E}
    .signup-section-help{font-size:12px;line-height:1.4;color:#8A7E7A}
    .store-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:flex;flex-direction:column;gap:7px;margin:0}
    label.full{grid-column:1/-1}
    label span{font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .field-note{font-size:11px;line-height:1.35;color:#958884;font-weight:500}
    .step-soft-note{margin-top:10px;padding:8px 10px;border-radius:12px;background:#FFFCFB;border:1px solid #EFE4E1;color:#8A7E7A;font-size:11.5px;line-height:1.4}
    input,select{width:100%;height:44px;border:1.5px solid #E5D8D5;border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:14px;padding:0 13px;outline:none;appearance:none}
    select{background-image:linear-gradient(45deg,transparent 50%,#8A7D79 50%),linear-gradient(135deg,#8A7D79 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
    input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(196,54,42,.08)}
    .phone-field{display:grid;grid-template-columns:118px 1fr;gap:10px}
    .choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
    .choice{position:relative;display:flex;align-items:center;gap:8px;border:1.5px solid #E7D8D5;border-radius:14px;background:#fff;padding:11px 12px;color:#4E423F;font-size:13px;font-weight:650;cursor:pointer}
    .choice input{width:16px;height:16px;accent-color:var(--red);flex:0 0 auto}
    .choice:has(input:checked){border-color:var(--red);background:#FFF7F5;box-shadow:0 0 0 4px rgba(196,54,42,.07)}
    .store-step .choice-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
    .store-step .choice{min-height:40px;padding:9px 34px 9px 11px;border-radius:13px;font-size:12.5px;line-height:1.25;justify-content:flex-start}
    .sales-step .choice-grid{grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
    .sales-step .choice{min-height:38px;padding-top:8px;padding-bottom:8px}
    .moment-step .choice-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:stretch}
    .moment-step .choice{align-items:center;justify-content:center;min-height:54px;padding:9px 32px 9px 12px;font-size:12px;text-align:center}
    .moment-step .choice span{display:flex;align-items:center;justify-content:center;min-height:34px;line-height:1.18;text-align:center;width:100%}
    .store-step .choice input{position:absolute;opacity:0;pointer-events:none}
    .store-step .choice:has(input:checked){border-color:rgba(196,54,42,.72);background:#FFF4F2;box-shadow:none}
    .store-step .choice:has(input:checked)::after{content:'✓';position:absolute;right:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
    .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:auto;padding:8px 24px 10px;background:#fff;border-top:1px solid rgba(240,230,227,.62)}
    button{border:none;border-radius:13px;height:44px;padding:0 18px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
    button:focus-visible{outline:3px solid rgba(196,54,42,.18);outline-offset:2px}
    .primary{background:var(--red);color:#fff;box-shadow:0 10px 20px rgba(196,54,42,.16)}
    .secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
    .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:#5E514E;border:1.5px solid #E5D8D5;box-shadow:none;margin-bottom:8px;font-size:13px;font-weight:600}
    .google-btn:hover{border-color:#D9C8C4;background:#FFFCFB}
    .google-mark{width:16px;height:16px;display:block;flex:0 0 auto}
    .purchase-email-notice{margin:0 0 10px;padding:10px 12px;border:1px solid rgba(196,54,42,.16);border-radius:13px;background:#FFFCFB;color:#5F514E;font-size:12px;line-height:1.42}
    .purchase-email-notice strong{color:#3F3430;font-weight:850}
    .divider{display:flex;align-items:center;gap:9px;color:#A89C98;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
    .divider::before,.divider::after{content:'';height:1px;background:var(--line);flex:1}
    button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .message{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin:12px 0 0;display:none}
    .message.show{display:block}
    .message.error{background:#FFF0EE;color:#9B271D;border:1px solid #F4C6BF}
    .message.info{background:#F4FAF7;color:#245A49;border:1px solid #CFE8DC}
    .success-box{background:linear-gradient(135deg,#FFFFFF 0%,#FFFCFB 100%);border:1px solid rgba(196,54,42,.24);border-radius:18px;padding:16px;color:#3F3633;line-height:1.5}
    .purchase-alert{background:linear-gradient(135deg,#FFFFFF 0%,#FFF8F6 100%);border:1px solid #F1B8B0;border-radius:18px;padding:18px;color:#3F3633;line-height:1.5;box-shadow:0 14px 34px rgba(155,39,29,.07)}
    .purchase-alert-head{display:flex;align-items:flex-start;gap:12px}
    .purchase-alert-icon{width:36px;height:36px;border-radius:13px;background:#FFF0EE;color:#9B271D;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}
    .purchase-alert-title{font-size:18px;font-weight:850;color:#261D1A;line-height:1.24;margin:0 0 6px}
    .purchase-alert-text{font-size:13.5px;color:#6F625E;line-height:1.55;margin:0}
    .purchase-alert-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .purchase-alert-actions button,.purchase-alert-actions a{min-height:42px;border-radius:12px;padding:0 14px;font-size:13px;font-weight:800;text-decoration:none}

    function isAccessStepValid(){

      }
      if(state.step===1 && (!d.ownerName || !d.whatsappNumber || !d.language)) return 'Preencha nome, WhatsApp e idioma da conta.';

          state.purchaseFound=!!(result.data&&result.data.purchaseFound);

        var code=err&&err.code?err.code:'';

    function signInWithGoogle(){

      if(state.loading) return;

      provider.setCustomParameters({prompt:'select_account'});
      return firebase.auth().signInWithPopup(provider).then(function(result){
        try{localStorage.removeItem(SIGNUP_GOOGLE_PENDING_KEY);}catch(e){}

        state.authCreated=true;
        state.data.email=user&&user.email?user.email:'';
        if(user&&user.displayName&&!state.data.ownerName) state.data.ownerName=user.displayName;
        return completeSignup({stage:'account_created',email:state.data.email}).then(function(response){
          state.purchaseFound=!!(response.data&&response.data.purchaseFound);
          state.step=1;
          render();
        });
      }).catch(function(err){
        var code=err&&err.code?err.code:'';
        if(code==='auth/popup-blocked'||code==='auth/cancelled-popup-request'||code==='auth/operation-not-supported-in-this-environment'){
          try{localStorage.setItem(SIGNUP_GOOGLE_PENDING_KEY,'1');}catch(e){}
          return firebase.auth().signInWithRedirect(provider);
        }
        if(code==='auth/popup-closed-by-user') setMsg('Login com Google cancelado. Você também pode criar acesso com e-mail e senha.','error');
        else if(code==='auth/account-exists-with-different-credential') setMsg('Já existe uma conta com esse e-mail usando outro método de acesso. Entre pelo Centro de Controle ou recupere sua senha.','error');
        else if(code==='auth/unauthorized-domain') setMsg('Este domínio ainda não está autorizado no Firebase Auth para login com Google.','error');
        else if(code==='auth/operation-not-allowed') setMsg('O login com Google ainda não está ativado no Firebase Auth.','error');
        else if(code==='auth/network-request-failed') setMsg('Falha de conexão ao abrir o Google. Verifique a rede e tente novamente.','error');
        else setMsg('Não foi possível entrar com Google. Código: '+(code||'erro_desconhecido')+'.','error');
      }).finally(function(){setLoading(false);});
    }
    function handleGoogleRedirectResult(){
      if(isPreview) return;
      var pending=false;
      try{pending=localStorage.getItem(SIGNUP_GOOGLE_PENDING_KEY)==='1';}catch(e){}
      firebase.auth().getRedirectResult().then(function(result){
        var user=(result&&result.user)||firebase.auth().currentUser;
        if(!pending||!user) return;
        try{localStorage.removeItem(SIGNUP_GOOGLE_PENDING_KEY);}catch(e){}
        state.authCreated=true;
        state.data.email=user.email||'';
        if(user.displayName&&!state.data.ownerName) state.data.ownerName=user.displayName;
        setLoading(true);
        setMsg('Google conectado. Preparando seu cadastro...','info');
        return completeSignup({stage:'account_created',email:state.data.email}).then(function(response){
          state.purchaseFound=!!(response.data&&response.data.purchaseFound);
          state.step=1;
          render();
        }).finally(function(){setLoading(false);});
      }).catch(function(err){
        try{localStorage.removeItem(SIGNUP_GOOGLE_PENDING_KEY);}catch(e){}
        setMsg('Não foi possível concluir o acesso com Google. Tente novamente ou use e-mail e senha.','error');
        console.error(err);
      });
    }
    function finish(){
      sync();
      if(isPreview){
        state.purchaseFound=previewHasPurchase;
        state.legalAccepted=false;
        state.legalSigned=false;
        state.step=6;
        render();
        setMsg(previewHasPurchase?'Prévia de compra ativa concluída. Nenhuma conta foi criada e nenhum dado foi salvo.':'Prévia sem compra ativa concluída. Nenhuma conta foi criada e nenhum dado foi salvo.','info');
        return Promise.resolve();
      }
      setLoading(true);
      var d=state.data;
      var payload=Object.assign({},d,{
        stage:'completed',
        businessType:Array.isArray(d.businessType)?d.businessType.join(', '):d.businessType,
        salesMode:Array.isArray(d.salesMode)?d.salesMode.join(', '):d.salesMode,
        whatsappFull:String(d.whatsappCountryCode||'')+String(d.whatsappNumber||'').replace(/\s+/g,'')
      });
      return completeSignup(payload).then(function(result){
        var data=result.data||{};
        state.purchaseFound=!!data.purchaseFound;
        state.legalAccepted=false;
        state.legalSigned=false;
        if(data.ok){
          state.step=6;render();
        }else{
          state.step=6;render();
        }
      }).catch(function(){
        setMsg('Não foi possível finalizar o cadastro. Tente novamente em instantes.','error');
      }).finally(function(){setLoading(false);});
    }
    document.getElementById('next-btn').addEventListener('click',function(){
      if(state.loading) return;
      if(state.step===6){
        if(state.purchaseFound) {
          var legalEl=document.getElementById('legal-acceptance');
          state.legalAccepted=!!(legalEl&&legalEl.checked);
          if(!state.legalAccepted){setMsg('Para entrar no Centro de Controle, aceite os Termos de uso e a Política de privacidade.','error');return;}
          if(isPreview){
            state.legalSigned=true;
            setMsg('Aceite simulado com sucesso. Nenhum dado foi salvo na prévia.','info');
            return;
          }
          setLoading(true);
          completeSignup({
            stage:'legal_acceptance',
            email:state.data.email,
            acceptedTerms:true,
            acceptedPrivacy:true,
            termsUrl:state.termsUrl,
            privacyUrl:state.privacyUrl,
            communicationPreferences:state.communicationPreferences
          }).then(function(){
            state.legalSigned=true;
            window.location.href='/admin.html#inicio';
          }).catch(function(){
            setMsg('Não foi possível registrar a assinatura dos termos. Tente novamente.','error');
          }).finally(function(){setLoading(false);});
        }
        if(isPreview){state.step=0;render();}
        return;
      }
      var error=validate();
      if(error){setMsg(error,'error');return;}
      if(state.step===0){createAccess();return;}
      if(state.step===5){finish();return;}
      sync();state.step+=1;render();
    });
    document.getElementById('back-btn').addEventListener('click',function(){if(state.loading)return;sync();state.step=Math.max(0,state.step-1);render();});
    render();
    handleGoogleRedirectResult();
  })();
  </script>
</body>
</html>
