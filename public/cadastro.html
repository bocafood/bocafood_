    function checkDuplicateSignupEmail(email){
      var normalized = String(email || '').trim();
      if (!normalized) return Promise.resolve({ available: false, message: 'Informe um e-mail válido.' });
      if (isPreview || !checkSignupEmailStatus) return Promise.resolve({ available: true });
      return firebase.auth().fetchSignInMethodsForEmail(normalized).then(function (methods) {
        if (methods && methods.length) {
          return { available: false, message: 'Já existe uma conta com esse e-mail. Faça login ou recupere sua senha.' };
        }
        return checkSignupEmailStatus({ email: normalized }).then(function (res) {
          var data = res && res.data ? res.data : res || {};
          if (data && data.found) {
            return { available: false, message: 'Já existe um cadastro com esse e-mail. Use outro e-mail ou recupere seu acesso.' };
          }
          return { available: true };
        }).catch(function () {
          return { available: true };
        });
      }).catch(function (err) {
        var code = err && err.code ? err.code : '';
        if (code === 'auth/invalid-email') {
          return { available: false, message: 'Informe um e-mail válido.' };
        }
        return { available: false, message: 'Não foi possível validar o e-mail agora. Tente novamente em instantes.' };
      });
    }

        return completeSignup({stage:'account_created',email:state.data.email}).then(function(response){
          state.purchaseFound=!!(response.data&&response.data.purchaseFound);
          state.accessMode=(response.data&&response.data.accessMode)|| (state.purchaseFound ? 'hotmart' : '');
          if(response.data&&response.data.trialEndsAt) state.trialEndsAt=response.data.trialEndsAt;
          trackSignupCreated();
          state.step=1;
          render();
        });
      }).catch(function(err){
        var code=err&&err.code?err.code:'';
        if(code==='auth/popup-blocked'||code==='auth/cancelled-popup-request'||code==='auth/operation-not-supported-in-this-environment'){
          try{localStorage.setItem(SIGNUP_GOOGLE_PENDING_KEY,'1');}catch(e){}
          return firebase.auth().signInWithRedirect(provider);
        }
        if(code==='auth/popup-closed-by-user') setMsg('Login com Google cancelado. Você também pode criar acesso com e-mail e senha.','error');
        else if(code==='auth/account-exists-with-different-credential') setMsg('Já existe uma conta com esse e-mail usando outro método de acesso. Entre pelo Centro de Controle ou recupere sua senha.','error');
        else if(code==='auth/unauthorized-domain') setMsg('Este domínio ainda não está autorizado no Firebase Auth para login com Google.','error');
        else if(code==='auth/operation-not-allowed') setMsg('O login com Google ainda não está ativado no Firebase Auth.','error');
        else if(code==='auth/network-request-failed') setMsg('Falha de conexão ao abrir o Google. Verifique a rede e tente novamente.','error');
        else setMsg('Não foi possível entrar com Google. Código: '+(code||'erro_desconhecido')+'.','error');
      }).finally(function(){setLoading(false);});
    }
    function handleGoogleRedirectResult(){
      if(isPreview) return;
      var pending=false;
      try{pending=localStorage.getItem(SIGNUP_GOOGLE_PENDING_KEY)==='1';}catch(e){}
      firebase.auth().getRedirectResult().then(function(result){
        var user=(result&&result.user)||firebase.auth().currentUser;
        if(!pending||!user) return;
        try{localStorage.removeItem(SIGNUP_GOOGLE_PENDING_KEY);}catch(e){}
        state.authCreated=true;
        state.data.email=user.email||'';
        if(user.displayName&&!state.data.ownerName) state.data.ownerName=user.displayName;
        setLoading(true);
        setMsg('Google conectado. Preparando seu cadastro...','info');
        return completeSignup({stage:'account_created',email:state.data.email}).then(function(response){
          state.purchaseFound=!!(response.data&&response.data.purchaseFound);
          state.accessMode=(response.data&&response.data.accessMode)|| (state.purchaseFound ? 'hotmart' : '');
          if(response.data&&response.data.trialEndsAt) state.trialEndsAt=response.data.trialEndsAt;
          trackSignupCreated();
          state.step=1;
          render();
        }).finally(function(){setLoading(false);});
      }).catch(function(err){
        try{localStorage.removeItem(SIGNUP_GOOGLE_PENDING_KEY);}catch(e){}
        setMsg('Não foi possível concluir o acesso com Google. Tente novamente ou use e-mail e senha.','error');
        console.error(err);
      });
    }
    function finish(){
      sync();
      if(isPreview){
        state.purchaseFound=true;
        state.accessMode=previewHasPurchase?'hotmart':'trial';
        state.trialEndsAt=previewHasPurchase?'':new Date(Date.now()+30*24*60*60*1000).toISOString();
        state.legalAccepted=false;
        state.legalSigned=false;
        state.step=6;
        render();
        setMsg(previewHasPurchase?'Prévia de compra ativa concluída. Nenhuma conta foi criada e nenhum dado foi salvo.':'Prévia do teste grátis concluída. Nenhuma conta foi criada e nenhum dado foi salvo.','info');
        return Promise.resolve();
      }
      setLoading(true);
      var d=state.data;
      var payload=Object.assign({},d,{
        stage:'completed',
        businessType:Array.isArray(d.businessType)?d.businessType.join(', '):d.businessType,
        salesMode:Array.isArray(d.salesMode)?d.salesMode.join(', '):d.salesMode,
        whatsappFull:String(d.whatsappCountryCode||'')+String(d.whatsappNumber||'').replace(/\s+/g,'')
      });
      return completeSignup(payload).then(function(result){
        var data=result.data||{};
        state.purchaseFound=!!data.purchaseFound;
        state.accessMode=data.accessMode || (state.purchaseFound ? 'hotmart' : '');
        if(data.trialEndsAt) state.trialEndsAt=data.trialEndsAt;
        state.legalAccepted=false;
        state.legalSigned=false;
        if(data.ok){
          state.step=6;render();
        }else{
          state.step=6;render();
        }
      }).catch(function(){
        setMsg('Não foi possível finalizar o cadastro. Tente novamente em instantes.','error');
      }).finally(function(){setLoading(false);});
    }
    document.getElementById('next-btn').addEventListener('click',function(){
      if(state.loading) return;
      if(state.step===6){
        if(state.purchaseFound) {
          var legalEl=document.getElementById('legal-acceptance');
          state.legalAccepted=!!(legalEl&&legalEl.checked);
          if(!state.legalAccepted){setMsg('Para finalizar o cadastro, aceite os Termos de uso e a Política de privacidade.','error');return;}
          if(isPreview){
            state.legalSigned=true;
            render();
            setMsg('Prévia da tela final. Nenhum dado foi salvo.','info');
            return;
          }
          setLoading(true);
          completeSignup({
            stage:'legal_acceptance',
            email:state.data.email,
            acceptedTerms:true,
            acceptedPrivacy:true,
            termsUrl:state.termsUrl,
            privacyUrl:state.privacyUrl,
            communicationPreferences:state.communicationPreferences
          }).then(function(){
            state.legalSigned=true;
            render();
          }).catch(function(){
            setMsg('Não foi possível registrar a assinatura dos termos. Tente novamente.','error');
          }).finally(function(){setLoading(false);});
        }
        if(isPreview){state.step=0;render();}
        return;
      }
      var error=validate();
      if(error){setMsg(error,'error');return;}
      if(state.step===0){
        setLoading(true);
        var startedCreate = false;
        checkDuplicateSignupEmail(state.data.email).then(function (result) {
          if (!result || result.available === false) {
            setMsg(result && result.message ? result.message : 'Não foi possível validar o e-mail agora. Tente novamente em instantes.','error');
            return;
          }
          startedCreate = true;
          createAccess();
        }).finally(function () {
          if (!startedCreate) {
            setLoading(false);
          }
        });
        return;
      }
      if(state.step===5){finish();return;}
      sync();state.step+=1;render();
    });
    document.getElementById('back-btn').addEventListener('click',function(){if(state.loading)return;sync();state.step=Math.max(0,state.step-1);render();});
    render();
    handleGoogleRedirectResult();
  })();
  </script>
</body>
</html>
