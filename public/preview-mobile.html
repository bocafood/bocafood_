<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview mobile | BocaFood</title>
  <link rel="icon" href="/assets/boca-food-favicon.png">
  <style>
    :root {
      --bf-red: #B42318;
      --bf-red-dark: #7F1711;
      --bf-bg: #FFF8F4;
      --bf-border: #E8DDD5;
      --bf-text: #211B18;
      --bf-muted: #766A60;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(180,35,24,.08), transparent 30%),
        linear-gradient(135deg, #FFFDFB 0%, var(--bf-bg) 55%, #F7ECE4 100%);
      color: var(--bf-text);
    }
    .page {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
      display: grid;
      grid-template-columns: minmax(260px, .8fr) 430px;
      gap: 28px;
      align-items: center;
      min-height: 100vh;
    }
    .intro {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(232,221,213,.88);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 44px rgba(85,46,32,.08), inset 0 1px 0 rgba(255,255,255,.74);
    }
    .brand {
      width: 156px;
      display: block;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--bf-red);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 420px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: .98;
      letter-spacing: -.045em;
    }
    .copy {
      max-width: 470px;
      margin: 14px 0 0;
      color: var(--bf-muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 560;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    .btn {
      min-height: 42px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--bf-border);
      background: #fff;
      color: var(--bf-text);
      font: inherit;
      font-size: 13px;
      font-weight: 760;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--bf-red), var(--bf-red-dark));
      color: #fff;
      box-shadow: 0 12px 24px rgba(180,35,24,.18);
    }
    .hint {
      margin-top: 18px;
      padding: 12px;
      border-radius: 16px;
      background: #FFFCF8;
      border: 1px solid var(--bf-border);
      color: #7B7168;
      font-size: 12px;
      line-height: 1.45;
    }
    .device-wrap {
      display: flex;
      justify-content: center;
    }
    .device {
      width: 410px;
      height: min(820px, calc(100vh - 56px));
      min-height: 680px;
      padding: 12px;
      border-radius: 38px;
      background: linear-gradient(145deg, #1F1714, #3A2A24);
      box-shadow: 0 34px 78px rgba(33,27,24,.22), 0 0 0 1px rgba(255,255,255,.18) inset;
      position: relative;
    }
    .device::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 50%;
      width: 92px;
      height: 20px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #211816;
      z-index: 2;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 29px;
      background: #fff;
      display: block;
    }
    @media (max-width: 900px) {
      .page {
        width: min(100vw - 20px, 560px);
        padding: 14px 0 22px;
        grid-template-columns: 1fr;
        align-items: start;
        gap: 16px;
      }
      .intro { order: 2; }
      .device-wrap { order: 1; }
      .device {
        width: min(410px, calc(100vw - 20px));
        height: min(760px, calc(100vh - 28px));
        min-height: 560px;
        padding: 9px;
        border-radius: 34px;
      }
      .device::before { top: 8px; width: 82px; height: 18px; }
      iframe { border-radius: 25px; }
      .intro { padding: 18px; border-radius: 20px; }
      .brand { width: 132px; margin-bottom: 16px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro">
      <img class="brand" src="/assets/boca-food-logo.png" alt="BocaFood">
      <p class="eyebrow">Preview mobile</p>
      <h1>Veja a loja como a cliente vê no celular</h1>
      <p class="copy">Use esta tela para revisar o template mobile no computador, sem precisar abrir o modo responsivo do navegador.</p>
      <div class="actions">
        <a class="btn primary" id="open-store" href="/" target="_blank" rel="noopener">Abrir loja em tela cheia</a>
        <button class="btn" type="button" id="reload-preview">Recarregar preview</button>
      </div>
      <div class="hint" id="preview-hint"></div>
    </section>
    <section class="device-wrap" aria-label="Preview da loja em celular">
      <div class="device">
        <iframe id="store-frame" title="Preview mobile da loja BocaFood"></iframe>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var tenant = params.get('tenant') || '';
      var slug = params.get('slug') || '';
      var src = params.get('src') || '';
      var target = '/';
      if (src) {
        target = src;
      } else if (tenant) {
        target = '/?tenant=' + encodeURIComponent(tenant);
      } else if (slug) {
        target = '/' + encodeURIComponent(slug);
      }
      var frame = document.getElementById('store-frame');
      var open = document.getElementById('open-store');
      var hint = document.getElementById('preview-hint');
      var reload = document.getElementById('reload-preview');
      frame.src = target;
      open.href = target;
      hint.textContent = tenant
        ? 'Carregando tenant: ' + tenant
        : (slug ? 'Carregando slug: ' + slug : 'Sem tenant informado. Adicione ?tenant=UID ou ?slug=nome-da-loja na URL.');
      reload.onclick = function () {
        frame.src = target + (target.indexOf('?') >= 0 ? '&' : '?') + '_previewReload=' + Date.now();
      };
    })();
  </script>
</body>
</html>
